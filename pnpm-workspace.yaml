# Configuração do pnpm 10 (o pnpm ignora o campo "pnpm" do package.json).

# Defesa contra pacotes comprometidos: só instala versões publicadas há pelo menos 14 dias
# (em minutos). Ataques de cadeia de suprimentos costumam ser detectados e retirados antes disso.
minimumReleaseAge: 20160

# Scripts de instalação ficam bloqueados por padrão; só estes podem rodar.
onlyBuiltDependencies:
  - esbuild
  - sharp

# Correções de segurança em dependências transitivas (alertas do Dependabot).
# fflate: o satori fixa 0.7.3 (GHSA-px8p-9vwx-vf98, corrigido em 0.7.5).
# source-map-js: postcss/css-tree ainda resolvem 1.2.1 (GHSA-68fv-2mgg-jv7q, corrigido em 1.2.2).
# vite: o astro resolve 8.3.1 (launch-editor: GHSA-587h-7wmj-h5pm, GHSA-r825-w8mm-5pxw, GHSA-698v-4r3x-3vcv, corrigido em 8.3.3).
overrides:
  fflate@<0.7.5: 0.7.5
  source-map-js@<1.2.2: 1.2.2
  vite@>=8.3.0 <8.3.3: 8.3.3
