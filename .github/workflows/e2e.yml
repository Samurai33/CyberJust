name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Testa a imagem Docker de produção (nginx, headers, CSP, redirects, Range) em Chromium, WebKit
# (Safari), iPhone, iPad e Android, com o mesmo contêiner do Playwright usado localmente.
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build da imagem de produção
        run: docker build -t cyberjust .
      - name: Sobe o site
        run: |
          docker run -d --name site -p 127.0.0.1:18080:8080 cyberjust
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:18080/robots.txt >/dev/null && break; sleep 1; done
      - name: Playwright
        run: |
          docker run --rm --network host --ipc=host -v "$PWD":/app -w /app -e CI=1 -e BASE_URL=http://127.0.0.1:18080 \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c "corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm install --frozen-lockfile && pnpm test:e2e"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
