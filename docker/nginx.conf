# Servidor estático do cyberjus.org (atrás do Traefik do Coolify + Cloudflare Tunnel).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

    # Barra codificada no caminho (%2F, %5C) é recusada: evita divergência entre o que o proxy vê e o
    # arquivo que o nginx serve. Só o caminho; a query string pode ter %2F legítimo.
    if ($request_uri ~* "^[^?]*%(2f|5c)") {
        return 400;
    }

    # Domínio canônico é o www (mesmo endereço do sitemap e das tags canonical). 301 num único salto.
    if ($host = cyberjus.org) {
        return 301 https://www.cyberjus.org$request_uri;
    }

    # Visitante chegou por HTTP na Cloudflare: força HTTPS.
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    # CSP sem 'unsafe-inline': o build do Astro gera CSS e JS só em arquivos (astro.config.mjs).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Padrão (HTML e demais arquivos).
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;

    # Endereços do site antigo (Next.js, /episodes/<número>) e dos episódios removidos em 14/10/2026: vão para a lista,
    # para não quebrar links já compartilhados.
    location = /episodes             { return 301 /episodios/; }
    location = /episodes/            { return 301 /episodios/; }
    location ~ ^/(episodes|episodios|episodio)/(7|6|5|13|ESPECIAL|3)/?$ { return 301 /episodios/; }
    location ~ ^/episodios/(fraudes-digitais|caso-lulu|namoral|fraude-e-estelionato|protecao-de-criancas|lava-jato-digital)/?$ { return 301 /episodios/; }
    location = /episodio             { return 301 /episodios/; }
    location = /episodio/            { return 301 /episodios/; }
    location = /sitemap.xml          { return 301 /sitemap-index.xml; }

    # Assets com hash no nome (CSS, JS, fontes): cache longo e imutável.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Áudio dos episódios: o nginx atende Range (206) nativamente, e o player toca em streaming.
    # Arquivo publicado nunca é sobrescrito (episódio novo = nome novo), então o cache é imutável.
    # CORP cross-origin + CORS: apps e players web de podcast tocam o áudio direto do feed.
    location /audio/ {
        types { audio/mp4 m4a; }
        include /etc/nginx/snippets/security-headers-public.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Transcrições e capítulos: lidos por apps de podcast de outras origens (Podcasting 2.0).
    location /transcricoes/ {
        types { text/vtt vtt; }
        include /etc/nginx/snippets/security-headers-public.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location ~ ^/episodios/[a-z0-9-]+/capitulos\.json$ {
        types { "application/json+chapters" json; }
        include /etc/nginx/snippets/security-headers-public.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Feed do podcast: lido por Apple, Spotify e agregadores (sem cache longo: episódio novo aparece logo).
    location = /podcast.xml {
        types { "application/rss+xml" xml; }
        charset utf-8;
        include /etc/nginx/snippets/security-headers-public.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=900" always;
        try_files $uri =404;
    }

    # Prévias de link (geral e por episódio), capa do podcast e ícones: CORP cross-origin, 1 dia.
    # Os nomes têm versão/hash: arte nova = URL nova.
    location ~* ^/(og-[a-z0-9-]+\.jpg|og/[a-z0-9-]+\.jpg|capa-podcast-v[0-9]+\.jpg|favicon\.ico|favicon-32x32\.png|icon-(192|512)\.png|apple-touch-icon\.png)$ {
        include /etc/nginx/snippets/security-headers-public.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Painel de episódios (Sveltia CMS). Protegido pelo Cloudflare Access neste caminho; fora dos buscadores.
    # CSP própria: o painel conversa com a API do GitHub (base: https://sveltiacms.app/en/docs/security).
    location ^~ /dash-ac0584219dc1/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data: https://avatars.githubusercontent.com https://raw.githubusercontent.com; media-src 'self' blob:; frame-src blob:; worker-src 'self' blob:; connect-src 'self' blob: data: https://api.github.com https://www.githubstatus.com https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
