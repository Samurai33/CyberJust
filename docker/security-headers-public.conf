# Para arquivos feitos para serem carregados por outros sites (imagem de prévia de link e ícones):
# igual a security-headers.conf, mas com CORP cross-origin. O WhatsApp Web roda com COEP require-corp
# e bloqueia a imagem da prévia se ela vier com CORP same-origin.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
